# Codemagic CI/CD — builds, signs, and uploads lit to the App Store with no Mac.
# Docs: https://docs.codemagic.io/yaml-code-signing/signing-ios/
#
# Before your first build, in the Codemagic UI you must:
#   - Add an App Store Connect API key under Teams > Personal Account >
#     Integrations > Developer Portal, and name it EXACTLY "lit App Store"
#     (or change the name below to match).
# Automatic signing below creates the certificate, provisioning profile, AND
# registers the bundle id in the Apple Developer Portal for you (--create).

workflows:
  ios-release:
    name: lit iOS release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: lit App Store        # <- must match the API key name in Codemagic
    environment:
      vars:
        BUNDLE_ID: "com.maiafrank.lit"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build the web app
        script: npm run build
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Set up automatic code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build the iOS app (.ipa)
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true            # uploads to TestFlight automatically
        # submit_to_app_store: false          # flip to true once your listing is ready
