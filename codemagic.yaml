# Codemagic CI/CD — builds, signs, and uploads lit to the App Store with no Mac.
# Docs: https://docs.codemagic.io/yaml-code-signing/signing-ios/
#
# This config authenticates with App Store Connect via ENVIRONMENT VARIABLES
# (not a named UI integration), so it works whether your app is under a
# personal account or a team.
#
# Before your first build, in Codemagic add a variable GROUP named "appstore"
# (App settings > Environment variables) with these three variables — mark
# each as Secure:
#   APP_STORE_CONNECT_ISSUER_ID       -> the Issuer ID (UUID) from App Store
#                                        Connect > Users and Access > Integrations
#   APP_STORE_CONNECT_KEY_IDENTIFIER  -> the Key ID of your API key
#   APP_STORE_CONNECT_PRIVATE_KEY     -> the FULL contents of the .p8 file,
#                                        including the BEGIN/END lines
# The Codemagic CLI reads these names automatically for both signing and upload.

workflows:
  ios-release:
    name: lit iOS release
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - appstore                              # <- the variable group you create in the UI
      vars:
        BUNDLE_ID: "com.maiafrank.lit"
        DEVELOPMENT_TEAM: "JT6S335647"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build the web app
        script: npm run build
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Sign and build the iOS app (.ipa)
        script: |
          echo "===== ENV CHECK (lengths only, no secrets) ====="
          echo "ISSUER_ID length: ${#APP_STORE_CONNECT_ISSUER_ID}"
          echo "KEY_ID length: ${#APP_STORE_CONNECT_KEY_IDENTIFIER}"
          echo "PRIVATE_KEY length: ${#APP_STORE_CONNECT_PRIVATE_KEY}"
          if [ -z "$APP_STORE_CONNECT_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_KEY_IDENTIFIER" ] || [ -z "$APP_STORE_CONNECT_PRIVATE_KEY" ]; then
            echo "ERROR: App Store Connect credentials are missing. Add APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_IDENTIFIER and APP_STORE_CONNECT_PRIVATE_KEY to a variable group named 'appstore' (mark them Secure) in the Codemagic UI." >&2
            exit 1
          fi
          set -e
          echo "===== INITIALIZE KEYCHAIN ====="
          keychain initialize
          echo "===== PREPARE CERTIFICATE PRIVATE KEY ====="
          # A private key is required to create/save the signing certificate.
          # Reuse one if provided (idempotent), otherwise generate a fresh key.
          if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            printf '%s' "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem
          else
            ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/cert_key.pem -q -N ""
          fi
          echo "===== FETCH / CREATE SIGNING FILES ====="
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --create \
            --verbose
          echo "===== ADD CERTIFICATES TO KEYCHAIN ====="
          keychain add-certificates
          echo "===== APPLY PROFILES TO PROJECT ====="
          xcode-project use-profiles --verbose
          echo "===== SIGNING IDENTITIES ====="
          security find-identity -v -p codesigning || echo "NO IDENTITIES"
          echo "===== PROFILES PRESENT ====="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" 2>/dev/null || echo "NO PROFILES DIR"
          echo "===== BUILDING IPA (build number $BUILD_NUMBER) ====="
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false             # just upload; build is usable for internal testing
        # submit_to_app_store: false            # flip to true once your listing is ready
